<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class Atlas — 우리 반 아카이브</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
  <style>
    :root{
      --bg:#F7F7FA;
      --surface:#FFFFFF;
      --surface-2:#F0F0F5;
      --glass:rgba(255,255,255,.82);
      --ink:#09090B;
      --ink-2:#52525B;
      --muted:#8E8E9A;
      --line:#E4E4EA;
      --line-soft:#EFEFF4;
      --brand:#4F46E5;
      --brand-soft:rgba(79,70,229,.10);
      --rose:#F43F5E;
      --rose-soft:rgba(244,63,94,.10);
      --emerald:#10B981;
      --emerald-soft:rgba(16,185,129,.12);
      --land:#EBEBF2;
      --land-line:#D4D4DF;
      --shadow-sm:0 1px 2px rgba(9,9,11,.04);
      --shadow-md:0 10px 30px -10px rgba(9,9,11,.08), 0 2px 6px rgba(9,9,11,.03);
      --shadow-lg:0 24px 60px -16px rgba(9,9,11,.22);
    }

    :root[data-theme="dark"]{
      --bg:#09090D;
      --surface:#121218;
      --surface-2:#1A1A23;
      --glass:rgba(18,18,24,.82);
      --ink:#F4F4F6;
      --ink-2:#A1A1B0;
      --muted:#6E6E80;
      --line:#252532;
      --line-soft:#1C1C26;
      --brand:#818CF8;
      --brand-soft:rgba(129,140,248,.14);
      --rose:#FB7185;
      --rose-soft:rgba(251,113,133,.14);
      --emerald:#34D399;
      --emerald-soft:rgba(52,211,153,.14);
      --land:#191924;
      --land-line:#2E2E3E;
      --shadow-sm:0 1px 2px rgba(0,0,0,.3);
      --shadow-md:0 12px 32px -12px rgba(0,0,0,.55);
      --shadow-lg:0 28px 70px -12px rgba(0,0,0,.8);
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      background:var(--bg);
      color:var(--ink);
      font-family:"Plus Jakarta Sans","Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif;
      line-height:1.5;
      -webkit-font-smoothing:antialiased;
      min-height:100vh;
    }

    /* ---------- sticky top navbar ---------- */
    .navbar{
      position:sticky;top:0;z-index:40;
      background:var(--glass);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      border-bottom:1px solid var(--line);
    }
    .nav-inner{
      max-width:1280px;margin:0 auto;padding:12px 20px;
      display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    }
    .brand{
      display:flex;align-items:center;gap:10px;
      font-weight:800;font-size:15.5px;letter-spacing:-.02em;
    }
    .brand-mark{
      width:30px;height:30px;border-radius:9px;
      background:linear-gradient(135deg, var(--brand), var(--rose));
      color:#fff;display:grid;place-items:center;
      font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:600;
    }
    .brand-sub{
      font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:500;
      color:var(--muted);padding:2px 8px;border-radius:999px;
      background:var(--surface-2);border:1px solid var(--line);
    }

    .seg{
      display:inline-flex;padding:4px;border-radius:12px;
      background:var(--surface-2);border:1px solid var(--line);gap:2px;
    }
    .seg-btn{
      appearance:none;border:0;background:transparent;color:var(--ink-2);
      padding:7px 14px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:600;
      cursor:pointer;display:inline-flex;align-items:center;gap:6px;
      transition:all .16s ease;
    }
    .seg-btn:hover{color:var(--ink)}
    .seg-btn.is-active{
      background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);
    }

    .nav-right{display:flex;align-items:center;gap:8px}
    .search-wrap{position:relative}
    .search-input{
      width:210px;padding:8px 12px 8px 32px;border-radius:10px;
      border:1px solid var(--line);background:var(--surface);color:var(--ink);
      font-family:inherit;font-size:13px;outline:none;transition:border-color .15s, width .2s;
    }
    .search-input:focus{border-color:var(--brand);width:245px}
    .search-icon{
      position:absolute;left:10px;top:50%;transform:translateY(-50%);
      color:var(--muted);pointer-events:none;font-size:13px;
    }
    .icon-btn{
      appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);
      height:35px;padding:0 12px;border-radius:10px;cursor:pointer;
      font-family:inherit;font-size:12.5px;font-weight:600;
      display:inline-flex;align-items:center;gap:6px;transition:border-color .15s;
    }
    .icon-btn:hover{border-color:var(--brand)}

    @media (max-width:860px){
      .search-input{width:150px}
      .search-input:focus{width:170px}
      .brand-sub{display:none}
    }

    /* ---------- main container ---------- */
    .main{max-width:1280px;margin:0 auto;padding:28px 20px 72px}

    .hero{
      display:flex;justify-content:space-between;align-items:flex-end;
      gap:20px;flex-wrap:wrap;margin-bottom:24px;
    }
    .hero h1{
      margin:0;font-size:clamp(26px,3.8vw,38px);font-weight:800;letter-spacing:-.03em;line-height:1.12;
    }
    .hero p{
      margin:8px 0 0;color:var(--ink-2);font-size:14.5px;max-width:56ch;
    }
    .kpi-strip{display:flex;gap:10px;flex-wrap:wrap}
    .kpi-chip{
      background:var(--surface);border:1px solid var(--line);border-radius:12px;
      padding:10px 14px;min-width:100px;box-shadow:var(--shadow-sm);
    }
    .kpi-chip .v{
      font-family:"JetBrains Mono",monospace;font-size:19px;font-weight:600;line-height:1.1;
    }
    .kpi-chip .k{font-size:11px;color:var(--muted);margin-top:2px;font-weight:500}

    .view{display:none}
    .view.is-active{display:block;animation:fadeUp .22s ease}
    @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

    /* ---------- filters ---------- */
    .filter-bar{
      display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
      margin-bottom:18px;
    }
    .chips{display:flex;gap:6px;flex-wrap:wrap}
    .fchip{
      appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
      padding:6px 13px;border-radius:999px;font-family:inherit;font-size:12.5px;font-weight:600;
      cursor:pointer;transition:all .14s;
    }
    .fchip:hover{border-color:var(--ink-2);color:var(--ink)}
    .fchip.is-on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
    .result-count{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted)}

    /* ---------- directory bento grid ---------- */
    .bento-grid{
      display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;
    }
    .mcard{
      background:var(--surface);border:1px solid var(--line);border-radius:18px;
      padding:20px;display:flex;flex-direction:column;gap:14px;
      box-shadow:var(--shadow-sm);cursor:pointer;
      transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      position:relative;
    }
    .mcard:hover{
      transform:translateY(-3px);
      box-shadow:var(--shadow-md);
      border-color:var(--brand);
    }
    .mcard-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .mcard-id{display:flex;align-items:center;gap:12px;min-width:0}
    .ava{
      width:44px;height:44px;border-radius:13px;flex:0 0 44px;
      color:#fff;font-weight:800;font-size:16px;
      display:grid;place-items:center;letter-spacing:-.02em;
    }
    .mcard-name{font-size:17px;font-weight:700;letter-spacing:-.01em}
    .mcard-loc{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}

    .tag-badge{
      font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;
      background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap;
    }
    .tag-badge.fun{background:var(--rose-soft);color:var(--rose);border-color:transparent}

    .mcard-body{display:flex;flex-direction:column;gap:10px}
    .hobby-row{display:flex;flex-wrap:wrap;gap:6px}
    .htag{
      font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:8px;
      background:var(--brand-soft);color:var(--brand);
    }
    .cherish-box{
      padding:9px 12px;border-radius:11px;background:var(--surface-2);
      font-size:12.5px;color:var(--ink-2);display:flex;gap:8px;align-items:baseline;
    }
    .cherish-box span{
      font-size:10.5px;font-weight:700;color:var(--muted);flex:0 0 auto;text-transform:uppercase;
    }
    .cherish-box b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    .mcard-foot{
      margin-top:auto;padding-top:12px;border-top:1px solid var(--line-soft);
      display:flex;align-items:center;justify-content:space-between;gap:8px;
    }
    .mini-links{display:flex;gap:6px;flex-wrap:wrap}
    .mlink{
      text-decoration:none;font-size:11.5px;font-weight:600;
      padding:5px 10px;border-radius:8px;
      border:1px solid var(--line);color:var(--ink-2);background:var(--surface);
      transition:all .14s;
    }
    .mlink:hover{border-color:var(--ink);color:var(--ink)}
    .mlink.live{background:var(--emerald-soft);color:var(--emerald);border-color:transparent}
    .mlink.off{color:var(--muted);opacity:.6;cursor:default}
    .more-arrow{font-size:12px;color:var(--muted);font-weight:600}

    /* ---------- interactive map view ---------- */
    .map-layout{
      display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start;
    }
    @media (max-width:1000px){ .map-layout{grid-template-columns:minmax(0,1fr)} }

    .map-canvas-wrap{
      background:var(--surface);border:1px solid var(--line);border-radius:22px;
      padding:16px;box-shadow:var(--shadow-md);position:relative;overflow:hidden;
    }
    .map-hud{
      display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
      margin-bottom:10px;
    }
    .map-title{
      font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:600;
      color:var(--muted);letter-spacing:.08em;text-transform:uppercase;
    }
    .map-svg{width:100%;display:block;border-radius:14px;background:var(--bg)}

    .pin-group{cursor:pointer}
    .pin-ring{fill:none;stroke:var(--rose);stroke-width:1.5;opacity:0}
    .pin-group.is-active .pin-ring{opacity:.8;animation:pulse 1.9s ease-out infinite}
    @keyframes pulse{0%{r:7;opacity:.9}100%{r:22;opacity:0}}
    .pin-dot{transition:r .15s ease, fill .15s ease}
    .pin-group:hover .pin-dot,.pin-group.is-active .pin-dot{fill:var(--rose)}
    .pin-label{
      font-size:11px;font-weight:700;fill:var(--ink);
      paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round;
      pointer-events:none;
    }
    .pin-count{
      font-family:"JetBrains Mono",monospace;font-size:9.5px;font-weight:700;fill:#fff;
      pointer-events:none;
    }

    .map-inspector{
      background:var(--surface);border:1px solid var(--line);border-radius:22px;
      padding:20px;box-shadow:var(--shadow-md);position:sticky;top:76px;
    }
    .insp-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
    .insp-head h3{margin:0;font-size:18px;font-weight:800}
    .insp-head span{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--muted)}
    .insp-list{display:flex;flex-direction:column;gap:10px}
    .insp-item{
      border:1px solid var(--line);border-radius:14px;padding:12px 14px;
      background:var(--bg);cursor:pointer;text-align:left;font-family:inherit;color:inherit;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      transition:border-color .14s, transform .14s;
    }
    .insp-item:hover{border-color:var(--brand);transform:translateX(2px)}
    .insp-item b{font-size:14.5px;display:block}
    .insp-item small{font-size:12px;color:var(--ink-2)}

    /* ---------- insights view ---------- */
    .insights-grid{
      display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;
    }
    .panel{
      background:var(--surface);border:1px solid var(--line);border-radius:20px;
      padding:22px;box-shadow:var(--shadow-sm);
    }
    .span-6{grid-column:span 6}
    .span-12{grid-column:span 12}
    @media (max-width:900px){ .span-6{grid-column:span 12} }

    .panel h3{
      margin:0 0 16px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center;
    }
    .panel h3 span{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);font-weight:500}

    .bar-list{display:flex;flex-direction:column;gap:11px}
    .bar-row{display:grid;grid-template-columns:130px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px}
    .bar-row .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
    .bar-row .trk{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
    .bar-row .fil{height:100%;border-radius:999px;background:linear-gradient(90deg, var(--brand), var(--rose))}
    .bar-row .cnt{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);text-align:right}

    .pages-table{width:100%;border-collapse:collapse;font-size:13px}
    .pages-table th{
      text-align:left;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);
      padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;
    }
    .pages-table td{padding:11px 12px;border-bottom:1px solid var(--line-soft)}
    .pages-table tr:hover td{background:var(--surface-2)}
    .pages-table tr{cursor:pointer}
    .table-wrap{overflow-x:auto}

    /* ---------- slide-over profile drawer ---------- */
    .drawer-backdrop{
      position:fixed;inset:0;z-index:80;
      background:rgba(9,9,11,.45);backdrop-filter:blur(4px);
      opacity:0;pointer-events:none;transition:opacity .2s ease;
    }
    .drawer-backdrop.is-open{opacity:1;pointer-events:auto}

    .drawer{
      position:fixed;top:12px;right:12px;bottom:12px;z-index:90;
      width:min(440px, calc(100vw - 24px));
      background:var(--surface);border:1px solid var(--line);
      border-radius:22px;box-shadow:var(--shadow-lg);
      display:flex;flex-direction:column;overflow:hidden;
      transform:translateX(calc(100% + 28px));
      transition:transform .24s cubic-bezier(.2,.8,.2,1);
    }
    .drawer.is-open{transform:translateX(0)}

    .drawer-top{
      padding:16px 20px;border-bottom:1px solid var(--line);
      display:flex;align-items:center;justify-content:space-between;gap:10px;
    }
    .drawer-nav{display:flex;gap:6px}
    .drawer-body{padding:24px 22px;overflow-y:auto;flex:1}

    .d-hero{display:flex;align-items:center;gap:16px}
    .d-ava{
      width:62px;height:62px;border-radius:18px;flex:0 0 62px;
      color:#fff;font-size:24px;font-weight:800;display:grid;place-items:center;
    }
    .d-name{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
    .d-sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}

    .d-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}
    .d-btn{
      text-decoration:none;padding:10px 14px;border-radius:12px;
      font-size:13px;font-weight:700;text-align:center;
      display:inline-flex;align-items:center;justify-content:center;gap:6px;
      transition:transform .14s, opacity .14s;
    }
    .d-btn:hover{transform:translateY(-1px);opacity:.92}
    .d-btn.full{grid-column:1 / -1}
    .d-btn.gh{background:var(--ink);color:var(--surface)}
    .d-btn.pg{background:var(--brand);color:#fff}
    .d-btn.ig{background:var(--rose-soft);color:var(--rose)}
    .d-btn.dis{background:var(--surface-2);color:var(--muted);pointer-events:none}

    .d-section{margin-top:22px}
    .d-label{
      font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.1em;
      text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:600;
    }
    .d-card{
      background:var(--bg);border:1px solid var(--line);border-radius:14px;
      padding:13px 15px;font-size:14px;font-weight:500;
    }
    .d-memo{
      margin-top:16px;padding:12px 14px;border-radius:14px;
      background:var(--rose-soft);color:var(--rose);font-size:13px;font-weight:600;
    }

    .empty-state{
      grid-column:1/-1;text-align:center;padding:56px 20px;
      background:var(--surface);border:1px dashed var(--line);border-radius:18px;
      color:var(--muted);font-size:14px;
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <div class="brand">
        <div class="brand-mark">CA</div>
        <span>Class Atlas</span>
        <span class="brand-sub">15 MEMBERS</span>
      </div>

      <nav class="seg" role="tablist" aria-label="화면 전환">
        <button class="seg-btn is-active" data-view="directory" type="button">디렉터리</button>
        <button class="seg-btn" data-view="map" type="button">인물 지도</button>
        <button class="seg-btn" data-view="insights" type="button">인사이트</button>
      </nav>

      <div class="nav-right">
        <div class="search-wrap">
          <span class="search-icon">⌕</span>
          <input class="search-input" id="searchInput" type="search" placeholder="이름, 취미, 지역 검색..." />
        </div>
        <button class="icon-btn" id="themeBtn" type="button">다크</button>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="hero">
      <div>
        <h1>우리 반 프로필 아카이브</h1>
        <p>15명의 GitHub · 제출 페이지 · 취향 · 거주 지역 데이터를 카드, 지도, 인사이트 뷰로 탐색해 보세요.</p>
      </div>
      <div class="kpi-strip">
        <div class="kpi-chip"><div class="v">15</div><div class="k">전체 인원</div></div>
        <div class="kpi-chip"><div class="v">14<small style="font-size:12px;color:var(--muted)">/15</small></div><div class="k">Pages 제출</div></div>
        <div class="kpi-chip"><div class="v">4</div><div class="k">최다 · 의정부</div></div>
      </div>
    </section>

    <!-- VIEW 1: DIRECTORY -->
    <section class="view is-active" id="view-directory">
      <div class="filter-bar">
        <div class="chips" id="regionChips">
          <button class="fchip is-on" data-reg="all" type="button">전체 15</button>
          <button class="fchip" data-reg="uijeongbu" type="button">의정부 4</button>
          <button class="fchip" data-reg="seoul" type="button">서울 4</button>
          <button class="fchip" data-reg="gyeonggi" type="button">경기 기타 5</button>
          <button class="fchip" data-reg="other" type="button">강원·경남 2</button>
        </div>
        <div class="result-count" id="resultCount">15명 표시 중</div>
      </div>
      <div class="bento-grid" id="bentoGrid"></div>
    </section>

    <!-- VIEW 2: INTERACTIVE MAP -->
    <section class="view" id="view-map">
      <div class="map-layout">
        <div class="map-canvas-wrap">
          <div class="map-hud">
            <span class="map-title">Capital Region &amp; Chuncheon · Korea Inset</span>
            <span class="map-title">핀을 클릭해 인원을 확인하세요</span>
          </div>
          <svg class="map-svg" id="mapSvg" viewBox="0 0 640 620" role="img" aria-label="거주지 분포 인터랙티브 지도"></svg>
        </div>

        <aside class="map-inspector" id="mapInspector"></aside>
      </div>
    </section>

    <!-- VIEW 3: INSIGHTS -->
    <section class="view" id="view-insights">
      <div class="insights-grid" id="insightsGrid"></div>
    </section>
  </main>

  <!-- SLIDE-OVER PROFILE DRAWER -->
  <div class="drawer-backdrop" id="backdrop"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-top">
      <div class="drawer-nav">
        <button class="icon-btn" id="prevBtn" type="button" title="이전 사람 (←)">← 이전</button>
        <button class="icon-btn" id="nextBtn" type="button" title="다음 사람 (→)">다음 →</button>
      </div>
      <button class="icon-btn" id="closeBtn" type="button" title="닫기 (Esc)">닫기 ✕</button>
    </div>

      function makeBars(arr, max){
        return "<div class='bar-list'>" + arr.map(function(x){
          return "<div class='bar-row'>" +
            "<div class='lbl'>"+esc(x[0])+"</div>" +
            "<div class='trk'><div class='fil' style='width:"+(x[1]/max*100)+"%'></div></div>" +
            "<div class='cnt'>"+x[1]+"</div>" +
          "</div>";
        }).join("") + "</div>";
      }

      var rows = P.map(function(p){
        return "<tr data-idx='"+p.idx+"'>" +
          "<td><b>"+esc(p.name)+"</b></td>" +
          "<td>"+esc(p.address)+"</td>" +
          "<td>"+esc(p.hobby)+"</td>" +
          "<td>"+esc(p.cherish)+"</td>" +
          "<td>"+(p.pages
            ? "<a class='mlink live' href='"+esc(p.pages)+"' target='_blank' rel='noopener noreferrer'>열기 ↗</a>"
            : "<span class='mlink off'>미제출</span>")+"</td>" +
        "</tr>";
      }).join("");

      var grid = document.getElementById("insightsGrid");
      grid.innerHTML =
        "<div class='panel span-6'><h3>거주지 분포 <span>12개 지역</span></h3>"+makeBars(regArr, maxReg)+"</div>" +
        "<div class='panel span-6'><h3>취미 Top 10 <span>키워드 기준</span></h3>"+makeBars(hobArr, maxHob)+"</div>" +
        "<div class='panel span-12'><h3>전체 제출 페이지 인덱스 <span>14 / 15 LIVE</span></h3>" +
          "<div class='table-wrap'><table class='pages-table'>" +
            "<thead><tr><th>이름</th><th>주소</th><th>취미</th><th>가장 아끼는 것</th><th>제출 페이지</th></tr></thead>" +
            "<tbody>"+rows+"</tbody>" +
          "</table></div>" +
        "</div>";

      grid.querySelectorAll("tbody tr").forEach(function(tr){
        tr.addEventListener("click", function(e){
          if(e.target.closest("a")) return;
          openDrawer(Number(tr.dataset.idx));
        });
      });
    }

    /* ============== 슬라이드 오버 드로어 ============== */
    var drawer = document.getElementById("drawer");
    var backdrop = document.getElementById("backdrop");

    function openDrawer(idx){
      drawerIdx = idx;
      var p = P[idx];
      if(!p) return;
      var isFun = p.gender && p.gender !== "여자" && p.gender !== "남자";
      var hobbies = splitHobbies(p.hobby).map(function(h){
        return "<span class='htag'>"+esc(h)+"</span>";
      }).join("");

      document.getElementById("drawerBody").innerHTML =
        "<div class='d-hero'>" +
          "<div class='d-ava' style='background:"+p.grad+"'>"+esc(p.name.charAt(0))+"</div>" +
          "<div>" +
            "<div class='d-name'>"+esc(p.name)+"</div>" +
            "<div class='d-sub'>" +
              (p.gender ? "<span class='tag-badge"+(isFun?" fun":"")+"'>"+esc(p.gender)+"</span>" : "<span class='tag-badge'>성별 미입력</span>") +
              "<span style='font-size:12.5px;color:var(--muted)'>"+esc(p.address)+"</span>" +
            "</div>" +
          "</div>" +
        "</div>" +

        "<div class='d-actions'>" +
          "<a class='d-btn gh' href='https://github.com/"+esc(p.gh)+"' target='_blank' rel='noopener noreferrer'>GitHub ↗</a>" +
          (p.ig
            ? "<a class='d-btn ig' href='"+esc(instaHref(p))+"' target='_blank' rel='noopener noreferrer'>"+esc(instaLabel(p))+" ↗</a>"
            : "<span class='d-btn dis'>인스타 미입력</span>") +
          (p.pages
            ? "<a class='d-btn pg full' href='"+esc(p.pages)+"' target='_blank' rel='noopener noreferrer'>제출 페이지 열기 ↗</a>"
            : "<span class='d-btn dis full'>제출 페이지 미제출</span>") +
        "</div>" +

        "<div class='d-section'><div class='d-label'>취미</div><div class='hobby-row'>"+hobbies+"</div></div>" +
        "<div class='d-section'><div class='d-label'>세상에서 가장 아끼는 것</div><div class='d-card'>"+esc(p.cherish)+"</div></div>" +
        "<div class='d-section'><div class='d-label'>GitHub 계정</div><div class='d-card' style='font-family:\"JetBrains Mono\",monospace;font-size:13px'>github.com/"+esc(p.gh)+"</div></div>" +
        (p.note ? "<div class='d-memo'>"+esc(p.note)+"</div>" : "");

      drawer.classList.add("is-open");
      backdrop.classList.add("is-open");
      drawer.setAttribute("aria-hidden", "false");
    }

    function closeDrawer(){
      drawer.classList.remove("is-open");
      backdrop.classList.remove("is-open");
      drawer.setAttribute("aria-hidden", "true");
    }

    document.getElementById("closeBtn").addEventListener("click", closeDrawer);
    backdrop.addEventListener("click", closeDrawer);
    document.getElementById("prevBtn").addEventListener("click", function(){
      openDrawer((drawerIdx - 1 + P.length) % P.length);
    });
    document.getElementById("nextBtn").addEventListener("click", function(){
      openDrawer((drawerIdx + 1) % P.length);
    });

    document.addEventListener("keydown", function(e){
      if(!drawer.classList.contains("is-open")) return;
      if(e.key === "Escape") closeDrawer();
      if(e.key === "ArrowLeft") openDrawer((drawerIdx - 1 + P.length) % P.length);
      if(e.key === "ArrowRight") openDrawer((drawerIdx + 1) % P.length);
    });

    renderDirectory();
  })();
  </script>
</body>
</html>
